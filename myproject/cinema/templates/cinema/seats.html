{% extends "cinema/base.html" %}
{% load static %}
{% block title %}Chọn ghế{% endblock %}
{% block content %}
<style>
  .seat-grid {
    display: grid;
    grid-template-columns: repeat(10, 2.6rem);
    gap: 0.4rem;
  }
  .seat-grid button, .seat-grid span {
    width: 2.6rem; height: 2.4rem; border-radius: 8px; text-align: center;
    line-height: 2.4rem; font-size: 0.8rem; border: 1px solid var(--line);
  }
  .seat-grid button { background: #243044; color: var(--text); cursor: pointer; }
  .seat-grid button:hover { border-color: var(--accent); color: var(--accent); }
  .seat-held { background: #3d3420; color: var(--muted); }
  .seat-booked { background: #2a1c22; color: #f5a8a8; }
</style>

<header>
  <h1 id = "seat-title"></h1>
  <p class="sub" id = "seat-sub"></p>
</header>

<div id = "seat-grid" class = "seat-grid"></div>
<p id = "seat-error" class = "empty" hidden></p>
<p class="helptext">Xanh: trống · vàng: pending · đỏ: booked.</p>
{% endblock %}

{% block scripts %}
<script>window.SHOWTIME_ID = "{{ showtime_id }}";</script>
<script src="{% static 'cinema/js/seats.js' %}"></script>
{% endblock %}

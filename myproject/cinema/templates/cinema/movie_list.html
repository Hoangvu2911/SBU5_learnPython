{% extends "cinema/base.html" %}
{% load static %}
{% block title %}Danh sách phim{% endblock %}
{% block content %}
  <header>
    <p class="sub">Các phim đang chiếu</p>
  </header>

  <form id="movie-filter" class="toolbar">
    <div>
      <label for="q">Tìm kiếm:</label>
      <input type="search" id="q" name="q" placeholder="Tên / đạo diễn / thể loại">
    </div>
    <div>
      <label for="genre">Thể loại:</label>
      <select id="genre" name="genre">
        <option value="">Tất cả thể loại</option>
        {% for g in genres %}
          <option value="{{ g }}">{{ g }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn">Lọc</button>
  </form>

  <ul id="movie-grid" class="grid"></ul>
  <p id="movie-empty" class="empty" hidden>Không có phim nào.</p>
  <nav id="movie-pagination" class="pagination"></nav>
{% endblock %}

{% block scripts %}
<script src="{% static 'cinema/js/movies.js' %}"></script>
{% endblock %}

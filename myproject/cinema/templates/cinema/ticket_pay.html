{% extends "cinema/base.html" %}
{% block title %}Thanh toán{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Thanh toán (API)</h1>
  <p class="sub" id="tp-sub"></p>
  <p>Status hiện tại: <span class="chip" id="tp-status"></span></p>
  <div id="tp-actions"></div>
  <a class="btn btn-outline" id="tp-back" href="{% url 'cinema:my_tickets' %}">Về vé của tôi</a>
</div>
{% endblock %}

{% block scripts %}
  {% load static %}
  {% csrf_token %}
  <script>
    window.TICKET_ID = parseInt("{{ ticket.pk }}", 10);
  </script>
  <script src="{% static 'cinema/js/ticket_pay.js' %}"></script>
{% endblock %}

{% extends "cinema/base.html" %}
{% load static %}
{% block title %}Vé của tôi{% endblock %}
{% block content %}
  <h1>Vé của tôi</h1>
  <form id="ticket-filter" method="get" class="toolbar">
    <div>
      <label for="q">Tìm kiếm:</label>
      <input id="q" type="search" name="q" value="{{ q }}" placeholder="Tên phim">
    </div>
    <div>
      <label for="status">Trạng thái:</label>
      <select id="status" name="status">
        <option value="">Tất cả</option>
        {% for value, label in status_choices %}
          <option value="{{ value }}" {% if status == value %}selected{% endif %}>
            {{ label }}
          </option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn">Lọc</button>
  </form>
  <ul id="ticket-grid" class="grid"></ul>
  <p id="ticket-empty" class="empty" hidden>Chưa có vé.</p>
  <nav id="ticket-pagination" class="pagination"></nav>
{% endblock %}
{% block scripts %}
  <script src="{% static 'cinema/js/my_tickets.js' %}"></script>
{% endblock %}

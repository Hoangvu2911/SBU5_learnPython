{% extends "cinema/base.html" %}
{% load static %}
{% block title %}Phim{% endblock %}
{% block content %}
  <header>
    <h1 id="movie-title"></h1>
    <p class="sub" id="movie-sub"></p>
  </header>
  <p id="movie-desc"></p>
  <p class="meta" id="movie-cast"></p>

  <h2>Lịch chiếu</h2>
  <ul id="showtime-grid" class="grid"></ul>
  <p id="showtime-empty" class="empty" hidden>Chưa có suất bookable.</p>
{% endblock %}

{% block scripts %}
<script>
  window.MOVIE_ID = "{{ movie_id }}";
  window.USER_AUTHENTICATED = "{{ user.is_authenticated|yesno:'true,false' }}";
</script>
<script src="{% static 'cinema/js/movie_detail.js' %}"></script>
{% endblock %}

{% extends "cinema/base.html" %}
{% load static %}
{% block title %}Suất chiếu{% endblock %}
{% block content %}
  <h1>Suất chiếu</h1>
  <p><a class="btn" href="{% url 'cinema:manage_showtime_create' %}">Thêm suất</a></p>
  <form method="get" class="form-stack" style="margin-bottom: 1.5rem;">
    <label>Phim</label>
    <select name="movie">
      <option value="">Tất cả</option>
      {% for m in movies %}
        <option value="{{ m.pk }}" {% if movie_id == m.pk|stringformat:"s" %}selected{% endif %}>{{ m.title }}</option>
      {% endfor %}
    </select>
    <label>Trạng thái</label>
    <select name="status">
      <option value="">Tất cả</option>
      {% for value, label in status_choices %}
        <option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn">Lọc</button>
  </form>
  <ul id="showtime-grid" class="grid"></ul>
  <p id="showtime-empty" class="empty" hidden>Chưa có suất.</p>
  <nav id="showtime-pagination" class="pagination"></nav>
{% endblock %}

{% block scripts %}
  <script src="{% static 'cinema/js/manage_showtimes.js' %}"></script>
{% endblock %}

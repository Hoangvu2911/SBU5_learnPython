{% extends "cinema/base.html" %}
{% load static %}
{% block title %}Vé{% endblock %}
{% block content %}
  <h1>Vé</h1>

  <form method="get" class="form-stack" style="margin-bottom: 1.5rem;">
    <label>Suất</label>
    <select name="showtime">
      <option value="">Tất cả</option>
      {% for s in showtimes %}
        <option value="{{ s.pk }}" {% if showtime_id == s.pk|stringformat:"s" %}selected{% endif %}>
          {{ s.movie.title }} — {{ s.room.name }} — {{ s.start_at }}
        </option>
      {% endfor %}
    </select>
    <label>Trạng thái</label>
    <select name="status">
      <option value="">Tất cả</option>
      {% for value, label in status_choices %}
        <option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn">Lọc</button>
  </form>

  <ul id="ticket-grid" class="grid"></ul>
  <p id="ticket-empty" class="empty" hidden>Chưa có vé.</p>
  <nav id="ticket-pagination" class="pagination"></nav>
{% endblock %}

{% block scripts %}
  <script src="{% static 'cinema/js/manage_tickets.js' %}"></script>
{% endblock %}
